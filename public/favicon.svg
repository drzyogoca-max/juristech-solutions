<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#020617" />
  <circle cx="256" cy="256" r="230" fill="url(#glow)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Glowing Shield -->
  <g filter="url(#neonShadow)">
    <path d="M256 64 L416 128 C416 288 256 424 256 448 C256 424 96 288 96 128 Z" fill="url(#shieldGrad)" />
    <!-- Inner Dark Core -->
    <path d="M256 92 L390 146 C390 274 256 388 256 410 C256 388 122 274 122 146 Z" fill="#020617" />
  </g>

  <!-- Sovereign Scales of Justice & Tech Nodes (Gold & Cyan) -->
  <!-- Central Pillar -->
  <rect x="248" y="160" width="16" height="190" rx="8" fill="url(#goldGrad)" />
  <!-- Balance Beam -->
  <path d="M160 210 L352 210" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
  <!-- Pillar Top Finial -->
  <circle cx="256" cy="160" r="14" fill="#38bdf8" stroke="#fbbf24" stroke-width="4" />

  <!-- Left Scale Pan -->
  <path d="M160 210 L130 270 L190 270 Z" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round" />
  <path d="M115 270 Q160 300 205 270 Z" fill="url(#shieldGrad)" />

  <!-- Right Scale Pan -->
  <path d="M352 210 L322 270 L382 270 Z" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round" />
  <path d="M307 270 Q352 300 397 270 Z" fill="url(#shieldGrad)" />

  <!-- Circuit / Tech Accent Points -->
  <circle cx="256" cy="380" r="10" fill="#06b6d4" />
  <circle cx="160" cy="210" r="8" fill="#fbbf24" />
  <circle cx="352" cy="210" r="8" fill="#fbbf24" />
</svg>
