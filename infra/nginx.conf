user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 10240; # Allow 10,000 concurrent connections per worker
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # High Concurrency & Speed Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Open File Cache Optimization
    open_file_cache max=20000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Gzip & Compression
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting for Peak Load Protection (10,000 requests burst limit)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=500r/s;

    server {
        listen 80;
        server_name legalshieldsolution.online www.legalshieldsolution.online;

        # Static Assets Cached at Edge CDN
        location /static/ {
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status "HIT-CDN";
        }

        # High Concurrency Non-Blocking API Proxy
        location /api/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://node_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    upstream node_backend {
        least_conn; # Load Balancing Algorithm
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
        keepalive 100;
    }
}
